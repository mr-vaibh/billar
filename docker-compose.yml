services:
  postgres:
    image: postgres:16-alpine
    container_name: billar-db
    environment:
      POSTGRES_USER: billar
      POSTGRES_PASSWORD: billar_secret
      POSTGRES_DB: billar
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billar"]
      interval: 10s
      timeout: 5s
      retries: 5

  billar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billar
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://billar:billar_secret@postgres:5432/billar
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
    driver: local
